baseURL = "https://benicafest.org/"
languageCode = "ca"
title = "Benicafest"

[params]
  festivalName    = "Benicafest"
  edition         = "II"
  date            = "13 de juny de 2026"
  doors           = "19:30"
  concertStart    = "20:00"
  location        = "Gaianes (el Comtat), País Valencià"
  freeEntry       = true
  organiser       = "L'Associació Cultural “El Castellet”, amb el suport de l'Ajuntament de Gaianes"
  description     = "Festival de música en valencià a Gaianes, el Comtat. Entrada gratuïta."
  descriptionLong = "El festival de música en valencià de Gaianes que obri les portes a l'estiu! Segona edició el 13 de juny de 2026, amb entrada totalment gratuïta per a tothom."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # allow HTML inside markdown if needed

# Sitemap
[sitemap]
  changefreq = "weekly"
  priority   = 0.5

# Enable robots.txt generation
enableRobotsTXT = true
